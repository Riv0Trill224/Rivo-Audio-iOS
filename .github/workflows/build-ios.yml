name: Build RIVØ Audio iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['RivoAudio/**', 'RivoAudioUITests/**', 'RivoAudioTests/**', 'project.yml', '.github/workflows/build-ios.yml']
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Verify simulator build
        run: xcodebuild -project RivoAudio.xcodeproj -scheme RivoAudio -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Select simulator
        id: simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Launch and navigation smoke test
        timeout-minutes: 15
        run: xcodebuild -project RivoAudio.xcodeproj -scheme RivoAudio -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoAudio-UI-test-report
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Build unsigned app for SideStore
        run: xcodebuild -project RivoAudio.xcodeproj -scheme RivoAudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/RivoAudio.app Payload/
          zip -qry RivoAudio-iOS-v0.1.2-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RivoAudio-iOS-v0.1.2-unsigned
          path: RivoAudio-iOS-v0.1.2-unsigned.ipa
          if-no-files-found: error
