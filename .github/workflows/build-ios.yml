name: Build RIVØ Audio iOS
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['RivoAudio/**', 'RivoAudioUITests/**', 'RivoAudioTests/**', 'project.yml', '.github/workflows/build-ios.yml']
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Verify simulator build
        run: xcodebuild -project RivoAudio.xcodeproj -scheme RivoAudio -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Create iPhone 13 simulator (390 x 844 points)
        id: simulator
        run: |
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[v for v in json.load(sys.stdin)["runtimes"] if v.get("isAvailable") and v["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(sorted(r, key=lambda v: tuple(map(int,v["version"].split("."))))[-1]["identifier"])')
          SIMULATOR_ID=$(xcrun simctl create "Rivo iPhone 13" com.apple.CoreSimulator.SimDeviceType.iPhone-13 "$RUNTIME_ID")
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
      - name: Launch and navigation smoke test
        timeout-minutes: 15
        run: xcodebuild -project RivoAudio.xcodeproj -scheme RivoAudio -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' -parallel-testing-enabled NO -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RivoAudio-UI-test-report
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Export UI screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path UIAttachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RivoAudio-UI-screenshots
          path: UIAttachments
          if-no-files-found: ignore
      - name: Build unsigned app for SideStore
        run: xcodebuild -project RivoAudio.xcodeproj -scheme RivoAudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/RivoAudio.app Payload/
          zip -qry RivoAudio-iOS-v0.1.5-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RivoAudio-iOS-v0.1.5-unsigned
          path: RivoAudio-iOS-v0.1.5-unsigned.ipa
          if-no-files-found: error
