name: RivoAudio
options:
  bundleIdPrefix: com.riv0trill
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  RivoAudio:
    type: application
    platform: iOS
    sources: [RivoAudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riv0trill.rivoaudio.ios
        INFOPLIST_FILE: RivoAudio/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
